# Local development only. Do not use this in production.
name: app-friends

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appfriends
      POSTGRES_PASSWORD: appfriends
      POSTGRES_DB: appfriends
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appfriends -d appfriends"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1055:1025" # SMTP
      - "8055:8025" # Web UI

volumes:
  postgres_data:
